# Build our sources; never replace them with the upstream published images.
services:
  api:
    image: mineos-custom-api:discord-v1
    pull_policy: never
    build:
      context: ./apps
      dockerfile: MineOS.Api/Dockerfile
      args:
        MINEOS_IMAGE_TAG: custom-discord
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5078
      ConnectionStrings__Default: Data Source=/app/data/mineos.db
      Auth__SeedUsername: ${Auth__SeedUsername:-admin}
      Auth__SeedPassword: ${Auth__SeedPassword:?Prepare .env.custom first}
      Auth__Jwt__SigningKey: ${Auth__JwtSecret:?Prepare .env.custom first}
      Auth__Jwt__Issuer: mineos-custom
      Auth__Jwt__Audience: mineos-custom-web
      ApiKey__SeedKey: ${ApiKey__SeedKey:?Prepare .env.custom first}
      Host__BaseDirectory: /var/games/minecraft
      Host__RunAsUid: ${MINECRAFT_UID:-1000}
      Host__RunAsGid: ${MINECRAFT_GID:-1000}
      MINEOS_TELEMETRY_ENABLED: "false"
    volumes:
      - ./minecraft:/var/games/minecraft
      - ./data:/app/data
    expose:
      - "5078"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5078/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${MC_PORT_RANGE:-25565-25570}:${MC_PORT_RANGE:-25565-25570}/tcp"
      - "${MC_PORT_RANGE:-25565-25570}:${MC_PORT_RANGE:-25565-25570}/udp"
      - "${BEDROCK_PORT_RANGE:-19132-19137}:${BEDROCK_PORT_RANGE:-19132-19137}/udp"

  web:
    image: mineos-custom-web:discord-v1
    pull_policy: never
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        PUBLIC_BUILD_ID: custom-discord-v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      NODE_ENV: production
      PRIVATE_API_BASE_URL: http://api:5078
      PRIVATE_API_KEY: ${ApiKey__SeedKey:?Prepare .env.custom first}
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-512M}
      PUBLIC_MC_PORT_RANGE: ${MC_PORT_RANGE:-25565-25570}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
