name: Publish custom Discord version

on:
  push:
    tags:
      - 'custom-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New custom-* release tag (never v*)'
        required: true
        type: string
      preview:
        description: 'Publish as a preview release'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate release tag and installer
        env:
          CUSTOM_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$CUSTOM_TAG" =~ ^custom-[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          bash test/install-test.sh
          bash -n scripts/prepare.sh
          bash -n scripts/migrate-layout.sh
          cp .env.template .env
          docker compose config --quiet
          python3 test/compose-config-test.py
      - name: Backend tests
        run: dotnet test apps/MineOS.Tests/MineOS.Tests.csproj -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Frontend checks and build
        working-directory: apps/web
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run build
      - name: Build Linux containers
        run: docker compose build
      - name: Check Linux startup
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          python3 test/deployment-smoke.py
      - name: Check Discord browser interactions on localhost and HTTP
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:6070
          # Disposable CI account from .env.template. No production credentials.
          MINEOS_E2E_USERNAME: admin
          MINEOS_E2E_PASSWORD: replace-with-a-unique-password
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/discord.spec.ts --workers=1 --reporter=line
      - name: Stop validation containers
        if: always()
        run: docker compose down

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release files
        env:
          CUSTOM_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/mineos-custom-source.tar.gz HEAD
          sed "s|^repository=.*|repository='${GITHUB_REPOSITORY}'|" install.sh > dist/install.sh
          (cd dist && sha256sum mineos-custom-source.tar.gz > mineos-custom-source.tar.gz.sha256)
          printf 'MineOS custom Discord — %s\n\n' "$CUSTOM_TAG" > dist/release-notes.md
          printf 'Source commit: %s\n\n' "$GITHUB_SHA" >> dist/release-notes.md
          printf 'Install this exact version:\n\n```bash\ncurl -fsSL https://github.com/%s/releases/download/%s/install.sh | bash -s -- --version %s\n```\n' \
            "$GITHUB_REPOSITORY" "$CUSTOM_TAG" "$CUSTOM_TAG" >> dist/release-notes.md
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUSTOM_TAG: ${{ inputs.tag || github.ref_name }}
          IS_PREVIEW: ${{ inputs.preview == true || (github.event_name == 'push' && contains(github.ref_name, '-preview')) }}
        run: |
          flags=(--latest)
          if [[ "$IS_PREVIEW" == true ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$CUSTOM_TAG" \
            dist/install.sh dist/mineos-custom-source.tar.gz dist/mineos-custom-source.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "MineOS custom Discord — $CUSTOM_TAG" \
            --notes-file dist/release-notes.md "${flags[@]}"
